    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-cursor {
      animation: cursorBlink 0.9s infinite;
    }

    /* 1. 标题 Wipe-up 动效 */
    .wipe-mask {
      display: block;
      overflow: hidden;
      padding-bottom: 0.08em;
    }

    .wipe-title {
      display: inline-block;
      transform: translateY(105%);
      opacity: 0;
      transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
      will-change: transform, opacity;
    }

    .wipe-title.visible {
      transform: translateY(0) !important;
      opacity: 1 !important;
    }

    /* 2. Apple 风格缓缓浮起 */
    .apple-float {
      opacity: 0;
      transform: translateY(35px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .apple-float.visible {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* 3. Education 底部单次平滑延伸箭头线 */
    @keyframes arrowDrawOnce {
      0% {
        transform: scaleX(0);
        opacity: 0;
      }
      100% {
        transform: scaleX(1);
        opacity: 1;
      }
    }
    .animate-arrow-draw {
      animation: arrowDrawOnce 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: left center;
    }

    @keyframes arrowHeadGlideOnce {
      0% {
        transform: translateX(-16px);
        opacity: 0;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }
    .animate-arrow-head-once {
      animation: arrowHeadGlideOnce 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const HELLO_WORDS = ["Hello", "你好", "Selamat Pagi", "Bonjour", "Hola", "Konnichiwa", "Guten Tag", "Ciao", "Olá"];
    const ROLES = ["SOFTWARE ENGINEERING", "DESIGNER", "ROBLOX DEVELOPER", "UI/UX DESIGNER"];

    const PROJECTS_DATA = [
      {
        id: "01",
        subtitle: "Genesis Tech Solutions",
        title: "Go fast. Go far.",
        category: "Corporate Website & CMS",
        link: "https://genesistech.com.my",
        hasLink: true,
        image: "public/assets/project_card.jpeg"
      },
      {
        id: "02",
        subtitle: "Presgrave & Matthews",
        title: "Built for legal excellence.",
        category: "Law Firm Platform",
        link: "https://presmat.com",
        hasLink: true,
        image: "public/assets/project_card.jpeg"
      },
      {
        id: "03",
        subtitle: "Food Ordering System",
        title: "Seamless dining workflow.",
        category: "Web Application & Dashboard",
        link: "#",
        hasLink: false,
        image: "public/assets/project_card.jpeg"
      },
      {
        id: "04",
        subtitle: "Personal Portfolio",
        title: "Modern craft & detail.",
        category: "Interactive Portfolio",
        link: "#",
        hasLink: false,
        image: "public/assets/project_card.jpeg"
      }
    ];

    function useTypewriter(words, typeSpeed = 75, deleteSpeed = 35, delayBetween = 1800) {
      const [text, setText] = useState("");
      const [wordIndex, setWordIndex] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);

      useEffect(() => {
        const currentWord = words[wordIndex % words.length];
        let timer;

        if (!isDeleting) {
          timer = setTimeout(() => {
            setText(currentWord.substring(0, text.length + 1));
            if (text.length + 1 === currentWord.length) {
              setTimeout(() => setIsDeleting(true), delayBetween);
            }
          }, typeSpeed);
        } else {
          timer = setTimeout(() => {
            setText(currentWord.substring(0, text.length - 1));
            if (text.length - 1 === 0) {
              setIsDeleting(false);
              setWordIndex((prev) => (prev + 1) % words.length);
            }
          }, deleteSpeed);
        }

        return () => clearTimeout(timer);
      }, [text, isDeleting, wordIndex, words, typeSpeed, deleteSpeed, delayBetween]);

      return text;
    }

    function App() {
      const [loading, setLoading] = useState(true);
      const [helloIndex, setHelloIndex] = useState(0);
      const [showBurger, setShowBurger] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [eduVisible, setEduVisible] = useState(false);
      const [aboutScrollOffset, setAboutScrollOffset] = useState(0);

      const projectsRef = useRef(null);
      const testimonialsRef = useRef(null);
      const educationRef = useRef(null);
      const aboutRef = useRef(null);

      // Projects 鼠标拖拽状态
      const [isProjectsDragging, setIsProjectsDragging] = useState(false);
      const [projectsStartX, setProjectsStartX] = useState(0);
      const [projectsScrollLeft, setProjectsScrollLeft] = useState(0);

      // Testimonials 鼠标拖拽状态
      const [isDragging, setIsDragging] = useState(false);
      const [startX, setStartX] = useState(0);
      const [scrollLeft, setScrollLeft] = useState(0);

      const typedRole = useTypewriter(ROLES);

      useEffect(() => {
        const interval = setInterval(() => {
          setHelloIndex((prev) => (prev < HELLO_WORDS.length - 1 ? prev + 1 : prev));
        }, 160);

        const timer = setTimeout(() => setLoading(false), 1800);
        return () => {
          clearInterval(interval);
          clearTimeout(timer);
        };
      }, []);

      // 滚动监听
      useEffect(() => {
        const checkVisibility = () => {
          const heroSection = document.getElementById("hero");
          if (heroSection) {
            const heroBottom = heroSection.getBoundingClientRect().bottom;
            setShowBurger(heroBottom <= 100);
          }

          if (educationRef.current) {
            const rect = educationRef.current.getBoundingClientRect();
            if (rect.top <= window.innerHeight * 0.85) {
              setEduVisible(true);
            }
          }

          if (aboutRef.current) {
            const rect = aboutRef.current.getBoundingClientRect();
            const progress = (window.innerHeight - rect.top) / (window.innerHeight + rect.height);
            setAboutScrollOffset(Math.max(-15, Math.min(15, (progress - 0.5) * 30)));
          }

          const targets = document.querySelectorAll(".wipe-title:not(.visible), .apple-float:not(.visible)");
          const windowHeight = window.innerHeight;

          targets.forEach((el) => {
            const rect = el.getBoundingClientRect();
            if (rect.top < windowHeight * 0.95) {
              el.classList.add("visible");
            }
          });
        };

        window.addEventListener("scroll", checkVisibility, { passive: true });
        
        const initTimer = setTimeout(checkVisibility, 200);
        const secondTimer = setTimeout(checkVisibility, 800);

        return () => {
          window.removeEventListener("scroll", checkVisibility);
          clearTimeout(initTimer);
          clearTimeout(secondTimer);
        };
      }, [loading]);

      useEffect(() => {
        document.body.style.overflow = menuOpen ? "hidden" : "unset";
      }, [menuOpen]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [loading, showBurger]);

      // Projects 拖拽逻辑
      const handleProjectsMouseDown = (e) => {
        setIsProjectsDragging(true);
        setProjectsStartX(e.pageX - projectsRef.current.offsetLeft);
        setProjectsScrollLeft(projectsRef.current.scrollLeft);
      };

      const handleProjectsMouseLeave = () => setIsProjectsDragging(false);
      const handleProjectsMouseUp = () => setIsProjectsDragging(false);

      const handleProjectsMouseMove = (e) => {
        if (!isProjectsDragging) return;
        e.preventDefault();
        const x = e.pageX - projectsRef.current.offsetLeft;
        const walk = (x - projectsStartX) * 1.5;
        projectsRef.current.scrollLeft = projectsScrollLeft - walk;
      };

      // Testimonials 拖拽逻辑
      const handleMouseDown = (e) => {
        setIsDragging(true);
        setStartX(e.pageX - testimonialsRef.current.offsetLeft);
        setScrollLeft(testimonialsRef.current.scrollLeft);
      };

      const handleMouseLeave = () => setIsDragging(false);
      const handleMouseUp = () => setIsDragging(false);

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - testimonialsRef.current.offsetLeft;
        const walk = (x - startX) * 1.5;
        testimonialsRef.current.scrollLeft = scrollLeft - walk;
      };

      const scrollProjects = (direction) => {
        if (projectsRef.current) {
          const scrollAmount = direction === "left" ? -380 : 380;
          projectsRef.current.scrollBy({ left: scrollAmount, behavior: "smooth" });
        }
      };

      const handleScrollToTop = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (window.location.hash) {
          window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const topNavItems = [
        { name: "Volunteering", url: "volunteering.html" },
        { name: "Projects", url: "projects.html" },
        { name: "Home", url: "index.html" },
        { name: "Experiences", url: "experiences.html" },
        { name: "Contact", url: "contact.html" }
      ];

      const burgerNavItems = [
        { name: "Home", url: "index.html" },
        { name: "Experiences", url: "experiences.html" },
        { name: "Projects", url: "projects.html" },
        { name: "Volunteering", url: "volunteering.html" },
        { name: "Contact", url: "contact.html" }

      const burgerDesktopClass = !menuOpen && !showBurger

      return (
        <div className="relative w-full bg-portfolio-bg text-portfolio-dark font-sans">

          {/* 1. INTRO PRELOADER */}
          {loading && (

              <h1 className="text-6xl md:text-8xl font-anton tracking-wider transition-all duration-200">
                {HELLO_WORDS[helloIndex]}
              </h1>
            </div>
          )}

          {/* 2. FLOATING BURGER BUTTON */}

          >
            <button

              className={`w-[88px] h-[88px] md:w-20 md:h-20 flex items-center justify-center transition-all duration-300 ${
                menuOpen
                  ? "bg-transparent border-transparent shadow-none"

              }`}
              aria-label="Toggle Menu"
            >
              <div className="w-8 h-6 md:w-8 md:h-6 relative flex flex-col justify-between items-center">
                <span

                />

                />
                <span
                  style={{ height: "3px" }}

                  }`}
                />

            </button>

              2026 © Ooi Yun Pei

          </div>

          {/* 4. HERO SECTION */}

                        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>

                      </svg>
                    </a>

                  {/* 3. 打字文字 */}
                  <div className="w-auto text-left md:w-auto md:text-left order-1 md:order-1">
                    <span className="md:hidden inline-flex items-center whitespace-nowrap font-jomhuria text-3xl font-normal text-portfolio-dark tracking-wide leading-none min-h-[1.6rem]">

                </div>

              </div>

            </div>

            {/* 人像与按钮 */}

              {/* 人像 */}

                <img

              {/* 按钮 */}
              <div className="absolute bottom-[6vh] sm:bottom-10 md:bottom-16 flex items-center justify-center gap-8 sm:gap-4 z-30 pointer-events-auto shadow-2xl">
                <a

                  className="w-[150px] h-[56px] px-0 py-0 md:w-auto md:h-auto md:px-8 md:py-1 bg-portfolio-dark text-white border-[1.5px] border-white md:border-[#C9CEC7] text-[28px] md:text-3xl font-jomhuria font-normal tracking-normal md:tracking-wider normal-case md:uppercase hover:bg-[#C9CEC7] hover:text-portfolio-dark hover:border-portfolio-dark transition-all duration-200 rounded-none flex items-center justify-center leading-none"

              <div className="flex items-center flex-nowrap justify-start gap-3 sm:gap-6 md:gap-8 mb-12 sm:mb-20 md:mb-24 w-full">
                <h1 className="font-anton text-[13.5vw] sm:text-[14.5vw] md:text-[12vw] leading-none tracking-tight text-portfolio-dark select-none uppercase whitespace-nowrap shrink-0">

                </h1>

                {/* 正圆卡通头像（手机端放大至 w-20 h-20） */}
                <div className="w-20 h-20 sm:w-28 sm:h-28 md:w-44 md:h-44 rounded-full overflow-hidden shrink-0 shadow-lg border-2 border-portfolio-dark/10">
                  <img
                    src="public/assets/vector_HCY_RED.jpeg"
                    alt="Character Vector"
                    className="w-full h-full object-cover"
                    onError={(e) => {
                      e.target.src = "public/assets/vector_character.png";
                    }}
                  />
                </div>
              </div>

              {/* 底部版权栏 */}
              <div className="flex justify-between items-center text-xs sm:text-sm font-sans font-semibold pt-6 border-t border-[#161816]/20">
                <p>2026 © Ooi Yun Pei</p>
                <button
                  type="button"
                  onClick={handleScrollToTop}
                  className="underline hover:opacity-80 transition-opacity cursor-pointer bg-transparent border-none p-0 text-inherit font-inherit select-none"
                >

            </div>

          </section>

        </div>

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
