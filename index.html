<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ooi Yun Pei | Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😉</text></svg>" type="image/svg+xml">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Jomhuria&family=Teachers:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            anton: ["Anton", "sans-serif"],
            jomhuria: ["Jomhuria", "cursive"],
            teachers: ["Teachers", "sans-serif"],
            sans: ["Plus Jakarta Sans", "sans-serif"],
          },
          colors: {
            portfolio: {
              bg: "#C9CEC7",
              sage: "#95A493",
              dark: "#0b0c0b",
              card: "#161816",
              inactive: "#7C837A",
              darkBrown: "#4A3525",
              darkBrownHover: "#362417",
              lightBg: "#e3e3df",
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, Babel & Lucide CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 引入拆分出的全套组件与数据 -->
  <script type="text/babel" src="Home/Preloader.js"></script>
  <script type="text/babel" src="Home/TopBar.js"></script>
  <script type="text/babel" src="Home/Hero.js"></script>
  <script type="text/babel" src="Home/About.js"></script>
  <script type="text/babel" src="Home/Education.js"></script>
  <script type="text/babel" src="Home/Help.js"></script>
  <script src="Home/projectsData.js"></script>
  <script type="text/babel" src="Home/Projects.js"></script>
  <script src="Home/testimonialsData.js"></script>
  <script type="text/babel" src="Home/Testimonials.js"></script>
  <script type="text/babel" src="Home/Footer.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .animate-cursor { animation: cursorBlink 0.9s infinite; }
    .wipe-mask { display: block; overflow: hidden; padding-bottom: 0.08em; }
    .wipe-title {
      display: inline-block;
      transform: translateY(105%);
      opacity: 0;
      transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
      will-change: transform, opacity;
    }
    .wipe-title.visible { transform: translateY(0) !important; opacity: 1 !important; }
    .apple-float {
      opacity: 0;
      transform: translateY(35px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .apple-float.visible { opacity: 1 !important; transform: translateY(0) !important; }
    @keyframes arrowDrawOnce { 0% { transform: scaleX(0); opacity: 0; } 100% { transform: scaleX(1); opacity: 1; } }
    .animate-arrow-draw { animation: arrowDrawOnce 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; transform-origin: left center; }
    @keyframes arrowHeadGlideOnce { 0% { transform: translateX(-16px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    .animate-arrow-head-once { animation: arrowHeadGlideOnce 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>

<body class="bg-[#C9CEC7] text-[#161816] selection:bg-[#161816] selection:text-[#C9CEC7] overflow-x-hidden antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [loading, setLoading] = useState(true);
      const [showBurger, setShowBurger] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [eduVisible, setEduVisible] = useState(false);
      const [aboutScrollOffset, setAboutScrollOffset] = useState(0);

      const educationRef = useRef(null);
      const aboutRef = useRef(null);

      useEffect(() => {
        const timer = setTimeout(() => setLoading(false), 1800);
        return () => clearTimeout(timer);
      }, []);

      useEffect(() => {
        const checkVisibility = () => {
          const heroSection = document.getElementById("hero");
          if (heroSection) {
            const heroBottom = heroSection.getBoundingClientRect().bottom;
            setShowBurger(heroBottom <= 100);
          }

          if (educationRef.current) {
            const rect = educationRef.current.getBoundingClientRect();
            if (rect.top <= window.innerHeight * 0.85) {
              setEduVisible(true);
            }
          }

          if (aboutRef.current) {
            const rect = aboutRef.current.getBoundingClientRect();
            const progress = (window.innerHeight - rect.top) / (window.innerHeight + rect.height);
            setAboutScrollOffset(Math.max(-15, Math.min(15, (progress - 0.5) * 30)));
          }

          const targets = document.querySelectorAll(".wipe-title:not(.visible), .apple-float:not(.visible)");
          const windowHeight = window.innerHeight;
          targets.forEach((el) => {
            const rect = el.getBoundingClientRect();
            if (rect.top < windowHeight * 0.95) {
              el.classList.add("visible");
            }
          });
        };

        window.addEventListener("scroll", checkVisibility, { passive: true });
        const initTimer = setTimeout(checkVisibility, 200);
        const secondTimer = setTimeout(checkVisibility, 800);

        return () => {
          window.removeEventListener("scroll", checkVisibility);
          clearTimeout(initTimer);
          clearTimeout(secondTimer);
        };
      }, [loading]);

      useEffect(() => {
        document.body.style.overflow = menuOpen ? "hidden" : "unset";
      }, [menuOpen]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [loading, showBurger]);

      const handleScrollToTop = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (window.location.hash) {
          window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <div className="relative w-full bg-portfolio-bg text-portfolio-dark font-sans">
          <Preloader loading={loading} />
          <TopBar showBurger={showBurger} menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
          <Hero />
          <About aboutRef={aboutRef} aboutScrollOffset={aboutScrollOffset} />
          <Education educationRef={educationRef} eduVisible={eduVisible} />
          <Help />
          <Projects />
          <Testimonials />
          <Footer handleScrollToTop={handleScrollToTop} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
