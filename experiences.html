<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiences | Ooi Yun Pei</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😉</text></svg>" type="image/svg+xml">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Jomhuria&family=Teachers:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            anton: ["Anton", "sans-serif"],
            jomhuria: ["Jomhuria", "cursive"],
            teachers: ["Teachers", "sans-serif"],
            sans: ["Plus Jakarta Sans", "sans-serif"],
          },
          colors: {
            portfolio: {
              bg: "#e3e3df",
              sage: "#95A493",
              dark: "#0b0c0b",
              card: "#161816",
              inactive: "#7C837A",
              darkBrown: "#4A3525",
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 标题动效 */
    .wipe-mask {
      display: block;
      overflow: hidden;
      padding-bottom: 0.08em;
    }
    .wipe-title {
      display: inline-block;
      transform: translateY(105%);
      opacity: 0;
      animation: wipeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }
    @keyframes wipeUp {
      0% { transform: translateY(105%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 淡入上浮动效 */
    .fade-float-in {
      opacity: 0;
      transform: translateY(16px);
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }
    @keyframes floatIn {
      0% { transform: translateY(16px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>

<body class="min-h-full bg-[#e3e3df] text-[#0b0c0b] selection:bg-[#0b0c0b] selection:text-[#e3e3df] antialiased">
  <div id="root" class="min-h-full"></div>

  <script type="text/babel">
    const { useState } = React;

    const workData = [
      {
        role: "Retail Salesperson",
        company: "Xiaomi Malaysia",
        period: "Aug 2025 - Nov 2025",
        type: "Part-time",
        tag: "Sales & Communication"
      },
      {
        role: "Part-time Technician",
        company: "Genesis Tech solution",
        period: "April 2025 - August 2025",
        type: "Part-time",
        tag: "Technical Support"
      },
      {
        role: "Computer Science Intern",
        company: "Genesis Tech solution",
        period: "Jan 2025 - March 2025",
        type: "Internship",
        tag: "Software Engineering"
      },
      {
        role: "Telco Promoter",
        company: "U Mobile Malaysia",
        period: "Aug 2024 - Dec 2025",
        type: "Contract",
        tag: "Customer Engagement"
      }
    ];

    const volunteerData = [
      {
        role: "Sub-Committee",
        company: "National Rover Scout Council (Malaysia)",
        period: "Aug 2025 - Present",
        type: "Leadership",
        tag: "Council Administration"
      },
      {
        role: "Assistant Scout Master",
        company: "21GTS Scout Troop",
        period: "2025 - Present",
        type: "Mentorship",
        tag: "Youth Development"
      },
      {
        role: "Rover Scout Member",
        company: "Condor Rover Crew",
        period: "2023 - Present",
        type: "Active Member",
        tag: "Community Service"
      }
    ];

    function ExperiencesPage() {
      const [menuOpen, setMenuOpen] = useState(false);
      const [activeTab, setActiveTab] = useState("work"); // 'work' | 'volunteering'

      const topNavItems = [
        { name: "Volunteering", url: "volunteering.html" },
        { name: "Projects", url: "projects.html" },
        { name: "Home", url: "index.html" },
        { name: "Experiences", url: "experiences.html" },
        { name: "Contact", url: "contact.html" }
      ];

      const currentList = activeTab === "work" ? workData : volunteerData;

      return (
        <div className="relative w-full min-h-screen flex flex-col justify-between bg-[#e3e3df] text-[#0b0c0b] font-sans select-none">
          
          {/* 1. 移动端正圆汉堡按钮 */}
          <div className="fixed top-5 right-5 z-[9999] md:hidden">
            <button
              onClick={() => setMenuOpen(!menuOpen)}
              className={`w-12 h-12 flex items-center justify-center transition-all duration-300 ${
                menuOpen
                  ? "bg-transparent border-transparent shadow-none"
                  : "bg-[#e3e3df]/90 backdrop-blur-sm border-[1.8px] border-[#0b0c0b] rounded-full shadow-sm active:bg-portfolio-dark group"
              }`}
              aria-label="Toggle Menu"
            >
              <div className="w-5 h-3.5 relative flex flex-col justify-between items-center">
                <span
                  style={{ height: "2px" }}
                  className={`w-full rounded-full transition-all duration-300 ease-in-out transform origin-center ${
                    menuOpen ? "absolute left-0 top-1/2 rotate-45 -translate-y-1/2 bg-white" : "relative bg-[#0b0c0b]"
                  }`}
                />
                <span
                  style={{ height: "2px" }}
                  className={`w-full rounded-full transition-all duration-200 ease-in-out ${
                    menuOpen ? "opacity-0 scale-x-0" : "relative bg-[#0b0c0b]"
                  }`}
                />
                <span
                  style={{ height: "2px" }}
                  className={`w-full rounded-full transition-all duration-300 ease-in-out transform origin-center ${
                    menuOpen ? "absolute left-0 top-1/2 -rotate-45 -translate-y-1/2 bg-white" : "relative bg-[#0b0c0b]"
                  }`}
                />
              </div>
            </button>
          </div>

          {/* 移动端抽屉菜单 */}
          <div
            className={`fixed inset-0 z-[9998] bg-[#121412]/95 backdrop-blur-md transition-all duration-500 flex flex-col justify-between p-8 md:hidden ${
              menuOpen ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none"
            }`}
          >
            <div className="w-full"></div>
            <div className="flex flex-col items-end gap-6 my-auto pr-6 text-right">
              {topNavItems.map((item, idx) => (
                <a
                  key={item.name}
                  href={item.url}
                  style={{
                    transitionDelay: menuOpen ? `${idx * 60}ms` : "0ms",
                    transform: menuOpen ? "translateX(0)" : "translateX(40px)",
                    opacity: menuOpen ? 1 : 0
                  }}
                  className={`font-jomhuria text-6xl tracking-wider transition-all duration-300 uppercase leading-none ${
                    item.name === "Experiences" ? "text-portfolio-sage font-bold" : "text-white/95 hover:text-portfolio-sage"
                  }`}
                >
                  {item.name}
                </a>
              ))}
            </div>
            <div className="border-t border-white/10 pt-4 text-center font-anton text-xs text-white/40 tracking-wider">
              2026 © Ooi Yun Pei
            </div>
          </div>

          {/* 2. 桌面端顶部导航栏 */}
          <header className="relative w-full pt-4 md:pt-6 pb-2 z-30 shrink-0 hidden md:block">
            <nav className="flex justify-center items-center gap-8 lg:gap-14 pt-2 px-6">
              {topNavItems.map((item) => {
                const isActive = item.name === "Experiences";
                return (
                  <a
                    key={item.name}
                    href={item.url}
                    className={`font-jomhuria text-2xl sm:text-3xl md:text-[34px] leading-none tracking-wider uppercase transition-all duration-200 ${
                      isActive
                        ? "text-[#0b0c0b] scale-105 font-bold"
                        : "text-[#7C837A] hover:text-[#0b0c0b] font-normal"
                    }`}
                  >
                    {item.name}
                  </a>
                );
              })}
            </nav>
          </header>

          {/* 3. 主页面内容 */}
          <main className="w-full flex-1 max-w-4xl mx-auto px-6 sm:px-12 py-10 md:py-14">
            
            {/* 页面标题 */}
            <div className="wipe-mask mb-4">
              <h1 className="wipe-title font-anton text-5xl sm:text-6xl md:text-7xl lg:text-8xl tracking-tight uppercase leading-none text-[#0b0c0b]">
                EXPERIENCES
              </h1>
            </div>

            <p className="fade-float-in font-teachers text-sm sm:text-base md:text-lg text-[#0b0c0b]/80 font-medium mb-8 max-w-2xl">
              A chronological journey of my career development, internships, leadership roles, and community contributions.
            </p>

            {/* 分类 Tab 切换 */}
            <div className="fade-float-in flex items-center gap-3 mb-12">
              <button
                onClick={() => setActiveTab("work")}
                className={`h-10 px-6 rounded-full border-[1.8px] border-[#0b0c0b] text-xs sm:text-sm font-bold transition-all duration-200 ${
                  activeTab === "work"
                    ? "bg-[#0b0c0b] text-[#e3e3df] shadow-sm"
                    : "bg-transparent text-[#0b0c0b] hover:bg-[#0b0c0b]/10"
                }`}
              >
                Work Experience
              </button>
              <button
                onClick={() => setActiveTab("volunteering")}
                className={`h-10 px-6 rounded-full border-[1.8px] border-[#0b0c0b] text-xs sm:text-sm font-bold transition-all duration-200 ${
                  activeTab === "volunteering"
                    ? "bg-[#0b0c0b] text-[#e3e3df] shadow-sm"
                    : "bg-transparent text-[#0b0c0b] hover:bg-[#0b0c0b]/10"
                }`}
              >
                Volunteering & Scouts
              </button>
            </div>

            {/* Timeline 时间轴主体 */}
            <div className="relative pl-6 sm:pl-8 border-l-[2px] border-[#0b0c0b]/20 space-y-10 my-4">
              {currentList.map((item, idx) => (
                <div key={idx} className="relative group">
                  
                  {/* 时间轴节点圆形标记 */}
                  <div className="absolute -left-[31px] sm:-left-[39px] top-1.5 w-3.5 h-3.5 rounded-full bg-[#e3e3df] border-[2.5px] border-[#0b0c0b] group-hover:bg-[#0b0c0b] group-hover:scale-125 transition-all duration-300"></div>

                  {/* 卡片内容 */}
                  <div className="bg-[#e3e3df] border border-[#0b0c0b]/15 rounded-2xl p-5 sm:p-6 transition-all duration-300 hover:border-[#0b0c0b]/40 hover:shadow-sm">
                    
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 mb-2">
                      <h2 className="text-lg sm:text-xl font-bold text-[#0b0c0b] tracking-tight">
                        {item.role}
                      </h2>
                      <span className="text-xs font-bold text-[#7C837A] tracking-wider uppercase">
                        {item.period}
                      </span>
                    </div>

                    <div className="flex flex-wrap items-center gap-2 mb-3">
                      <span className="text-sm font-semibold text-[#0b0c0b]/80">
                        {item.company}
                      </span>
                      <span className="text-[#0b0c0b]/30">•</span>
                      <span className="text-xs px-2.5 py-0.5 rounded-md bg-[#0b0c0b]/5 text-[#0b0c0b]/70 font-medium">
                        {item.type}
                      </span>
                    </div>

                    <div className="inline-block px-3 py-1 rounded-lg border border-[#0b0c0b]/10 text-xs font-medium text-[#7C837A]">
                      {item.tag}
                    </div>

                  </div>
                </div>
              ))}

              {/* Experiences Coming Soon 占位块 */}
              {activeTab === "work" && (
                <div className="relative group">
                  <div className="absolute -left-[31px] sm:-left-[39px] top-1.5 w-3.5 h-3.5 rounded-full bg-[#e3e3df] border-[2px] border-dashed border-[#7C837A]"></div>
                  <div className="border border-dashed border-[#0b0c0b]/20 rounded-2xl p-5 sm:p-6 text-center text-sm font-semibold text-[#7C837A]">
                    More Experiences Coming Soon...
                  </div>
                </div>
              )}
            </div>

          </main>

          {/* 4. 底部版权栏 */}
          <footer className="w-full px-6 sm:px-12 md:px-16 py-4 border-t border-[#0b0c0b]/10 flex justify-between items-center text-xs font-sans font-medium text-[#0b0c0b]/50 shrink-0">
            <span>2026 © Ooi Yun Pei</span>
            <span>Say Hello!</span>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ExperiencesPage />);
  </script>
</body>
</html>
