<!DOCTYPE html>
<html lang="en" class="h-full">
<head>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😉</text></svg>" type="image/svg+xml">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Jomhuria&family=Teachers:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            anton: ["Anton", "sans-serif"],
            jomhuria: ["Jomhuria", "cursive"],
            teachers: ["Teachers", "sans-serif"],
            sans: ["Plus Jakarta Sans", "sans-serif"],
          },
          colors: {
            portfolio: {
              bg: "#e3e3df",
              sage: "#95A493",
              dark: "#0b0c0b",
              card: "#161816",
              inactive: "#7C837A",
              darkBrown: "#4A3525",
              darkBrownHover: "#362417",
              lightBg: "#e3e3df",
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 标题 Wipe-up 动效 */
    .wipe-mask {
      display: block;
      overflow: hidden;
      padding-bottom: 0.08em;
    }
    .wipe-title {
      display: inline-block;
      transform: translateY(105%);
      opacity: 0;
      animation: wipeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }
    @keyframes wipeUp {
      0% { transform: translateY(105%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 浮现入场动效 */
    .fade-float-in {
      opacity: 0;
      transform: translateY(18px);
      animation: floatIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      will-change: transform, opacity;
    }
    @keyframes floatIn {
      0% { transform: translateY(18px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* Anxiety 呼吸浮动 */
    @keyframes subtleHover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(0.8deg); }
    }
    .anxiety-float {
      animation: subtleHover 4.5s ease-in-out infinite;
    }

    /* 桌面端 Email Me 悬浮上下翻转文字动效 */
    .roll-text-container {
      position: relative;
      display: inline-block;
      overflow: hidden;
      height: 1.25rem;
      vertical-align: middle;
    }
    .roll-text-inner {
      display: flex;
      flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .email-btn:hover .roll-text-inner {
      transform: translateY(-50%);
    }
  </style>
</head>

<body class="h-full bg-[#e3e3df] text-[#0b0c0b] selection:bg-[#0b0c0b] selection:text-[#e3e3df] antialiased overflow-hidden">
