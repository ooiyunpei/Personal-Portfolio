<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Ooi Yun Pei</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😉</text></svg>" type="image/svg+xml">

  <!-- Devicon 图标库（包含绝大多数编程语言与开发工具矢量图标） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Jomhuria&family=Teachers:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            anton: ["Anton", "sans-serif"],
            jomhuria: ["Jomhuria", "cursive"],
            teachers: ["Teachers", "sans-serif"],
            sans: ["Plus Jakarta Sans", "sans-serif"],
          },
          colors: {
            portfolio: {
              bg: "#e3e3df",
              sage: "#95A493",
              dark: "#0b0c0b",
              card: "#161816",
              inactive: "#7C837A",
              darkBrown: "#4A3525",
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 标题动效 */
    .wipe-mask {
      display: block;
      overflow: hidden;
      padding-bottom: 0.08em;
    }
    .wipe-title {
      display: inline-block;
      transform: translateY(105%);
      opacity: 0;
      animation: wipeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }
    @keyframes wipeUp {
      0% { transform: translateY(105%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 淡入上浮动效 */
    .fade-float-in {
      opacity: 0;
      transform: translateY(16px);
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }
    @keyframes floatIn {
      0% { transform: translateY(16px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 三行跑马灯无缝动画 */
    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes scrollRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    .animate-marquee-left {
      display: flex;
      width: max-content;
      animation: scrollLeft 28s linear infinite;
    }
    .animate-marquee-right {
      display: flex;
      width: max-content;
      animation: scrollRight 28s linear infinite;
    }
    .animate-marquee-left-fast {
      display: flex;
      width: max-content;
      animation: scrollLeft 24s linear infinite;
    }

    .animate-marquee-left:hover,
    .animate-marquee-right:hover,
    .animate-marquee-left-fast:hover {
      animation-play-state: paused;
    }

    /* 左右边缘渐变遮罩 */
    .mask-gradient-x {
      mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
    }

    /* 卡片专属工程点阵纹理图案 */
    .card-pattern-grid {
      background-color: #deded9;
      background-image: 
        radial-gradient(#0b0c0b 0.75px, transparent 0.75px), 
        linear-gradient(to right, rgba(11, 12, 11, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(11, 12, 11, 0.03) 1px, transparent 1px);
      background-size: 20px 20px, 40px 40px, 40px 40px;
    }

    /* 卡片悬浮微妙发光边线 */
    .project-card {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-card:hover {
      transform: translateY(-4px);
      border-color: rgba(11, 12, 11, 0.45);
      box-shadow: 0 12px 30px -10px rgba(11, 12, 11, 0.08);
    }
  </style>
</head>

<body class="min-h-full bg-[#e3e3df] text-[#0b0c0b] selection:bg-[#0b0c0b] selection:text-[#e3e3df] antialiased">
  <div id="root" class="min-h-full"></div>

  <script type="text/babel">
    const { useState } = React;

    // 自定义特殊工具 SVG 图标组件
    const CustomIcon = ({ name }) => {
      switch (name) {
        case "Gemini":
          return (

          );
        case "ChatGPT":
          return (
            <svg viewBox="0 0 24 24" className="w-8 h-8 fill-current">
              <path d="M20.5 10.2a5.2 5.2 0 0 0-.4-4.1 5.3 5.3 0 0 0-5.1-2.5 5.2 5.2 0 0 0-4-1.8 5.3 5.3 0 0 0-5 3.6 5.2 5.2 0 0 0-3.3 2.4 5.3 5.3 0 0 0 .5 5.6 5.2 5.2 0 0 0 .4 4.1 5.3 5.3 0 0 0 5.1 2.5 5.2 5.2 0 0 0 4 1.8 5.3 5.3 0 0 0 5-3.6 5.2 5.2 0 0 0 3.3-2.4 5.3 5.3 0 0 0-.5-5.6zm-7.6 10.3a3.8 3.8 0 0 1-2.6-1l.1-.6 2.5-1.4a.8.8 0 0 0 .4-.7v-3.5l1.1.6v3.2a3.8 3.8 0 0 1-1.5 3.4zm-6.6-2.8a3.8 3.8 0 0 1-1-2.6v-.6l2.5 1.5a.8.8 0 0 0 .8 0l3-1.8v1.3l-2.8 1.6a3.8 3.8 0 0 1-2.5.6zm-1.8-6.7a3.8 3.8 0 0 1 1.6-2.3l.5.3v2.9a.8.8 0 0 0 .4.7l3 1.7-1.1.7-2.8-1.6a3.8 3.8 0 0 1-1.6-2.4zm10.7-1.3-3-1.7 1.1-.7 2.8 1.6a3.8 3.8 0 0 1 1.6 2.4 3.8 3.8 0 0 1-1.6 2.3l-.5-.3v-2.9a.8.8 0 0 0-.4-.7zm2.8 5.2a3.8 3.8 0 0 1-1.5 2.5l-2.5-1.4a.8.8 0 0 0-.8 0l-3 1.7v-1.3l2.8-1.6a3.8 3.8 0 0 1 2.5-.6 3.8 3.8 0 0 1 2.5.7zm-6.9-2.3-1.4-.8-1.4.8v-1.6l1.4-.8 1.4.8v1.6z"/>

            </svg>
          );
        case "Blackmagic":
          return (
            <svg viewBox="0 0 24 24" className="w-8 h-8 fill-current">

    // 24 个工具均匀切分进 3 行（每行 8 个），每行首尾双倍复制以实现无缝无限跑马灯

      { name: "JavaScript", icon: "devicon-javascript-plain" },
      { name: "Bootstrap", icon: "devicon-bootstrap-plain" },
      { name: "Tailwind CSS", icon: "devicon-tailwindcss-plain" },
      { name: "Python", icon: "devicon-python-plain" },
      { name: "C++", icon: "devicon-cplusplus-plain" },
      { name: "VS Code", icon: "devicon-vscode-plain" }
    ];

    const row2Tools = [
      { name: "GitHub", icon: "devicon-github-original" },
      { name: "PyCharm", icon: "devicon-pycharm-plain" },

    const row3Tools = [

      { name: "Roblox Studio", custom: true },
      { name: "Blackmagic", custom: true },
      { name: "CapCut", custom: true },
      { name: "Meta", custom: true },
      { name: "TeamViewer", custom: true },
      { name: "Word", custom: true },
      { name: "Excel", custom: true }

    // 单个大图标卡片渲染组件
    const ToolIconCard = ({ item }) => (

          {item.name}
        </span>
      </div>
    );

    const projectCards = [
      {
        category: "Company Website Revamp",
        title: "Genesis Tech Solutions",
        description: "Official corporate website revamp focusing on responsive user interface, modernized presentation, and service showcase.",
        link: "https://genesistech.com.my",
        displayLink: "genesistech.com.my",
        status: "Live",
        tags: ["Web Revamp", "Corporate", "Responsive"]

      {

      },
      {

      },
      {

        displayLink: "yunpeiooi.my",
        status: "Live",
        tags: ["Personal Branding", "React", "Tailwind CSS"]
      }
    ];

    function ProjectsPage() {
      const [menuOpen, setMenuOpen] = useState(false);

      const topNavItems = [
        { name: "Volunteering", url: "volunteering.html" },
        { name: "Projects", url: "projects.html" },
        { name: "Home", url: "index.html" },
        { name: "Experiences", url: "experiences.html" },

                {/* 第一行：向左无限移动 */}
                <div className="animate-marquee-left">
                  {row1Tools.concat(row1Tools).map((item, idx) => (

                  {row3Tools.concat(row3Tools).map((item, idx) => (

                  ))}

                  Featured Works

                    {/* 卡片右上角极简几何修饰图案 */}
                    <div className="absolute top-0 right-0 w-28 h-28 pointer-events-none opacity-[0.07] overflow-hidden">
                      <svg viewBox="0 0 100 100" className="w-full h-full fill-[#0b0c0b]">

                    <div className="relative z-10">
                      {/* 顶部标签与状态 */}

                        <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full ${
                          project.status === "Live"
                            ? "bg-emerald-500/15 text-emerald-800 border border-emerald-600/25"

                      {/* 项目标题 */}

                      {/* 描述 */}
                      <p className="font-teachers text-sm text-[#0b0c0b]/80 leading-relaxed mb-6 font-normal">
                        {project.description}
                      </p>
                    </div>

                    <div className="relative z-10">
                      {/* 技术标签 */}
                      <div className="flex flex-wrap gap-1.5 mb-6">
                        {project.tags.map((tag) => (
                          <span
                            key={tag}
                            className="text-[10px] px-2.5 py-0.5 rounded-md bg-[#e3e3df]/90 border border-[#0b0c0b]/15 text-[#0b0c0b]/75 font-semibold"
                          >
                            {tag}
                          </span>
                        ))}
                      </div>

                      {/* 链接按钮 */}
                      {project.link ? (

                          </span>

                            <line x1="7" y1="17" x2="17" y2="7"></line>

                        </a>
                      ) : (
                        <span className="inline-flex items-center gap-1.5 text-xs font-medium text-[#7C837A] italic">
