<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Ooi Yun Pei</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😉</text></svg>" type="image/svg+xml">

  <!-- Devicon 图标库 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Jomhuria&family=Teachers:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            anton: ["Anton", "sans-serif"],
            jomhuria: ["Jomhuria", "cursive"],
            teachers: ["Teachers", "sans-serif"],
            sans: ["Plus Jakarta Sans", "sans-serif"],
          },
          colors: {
            portfolio: {
              bg: "#e3e3df",
              sage: "#95A493",
              dark: "#0b0c0b",
              card: "#161816",
              inactive: "#7C837A",
              darkBrown: "#4A3525",
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 标题动效 */
    .wipe-mask {
      display: block;
      overflow: hidden;
      padding-bottom: 0.08em;
    }
    .wipe-title {
      display: inline-block;
      transform: translateY(105%);
      opacity: 0;
      animation: wipeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }
    @keyframes wipeUp {
      0% { transform: translateY(105%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .fade-float-in {
      opacity: 0;
      transform: translateY(16px);
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }
    @keyframes floatIn {
      0% { transform: translateY(16px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 三行跑马灯无缝动画 */
    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes scrollRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    .animate-marquee-left {
      display: flex;
      width: max-content;
      animation: scrollLeft 32s linear infinite;
    }
    .animate-marquee-right {
      display: flex;
      width: max-content;
      animation: scrollRight 32s linear infinite;
    }
    .animate-marquee-left-fast {
      display: flex;
      width: max-content;
      animation: scrollLeft 28s linear infinite;
    }

    .animate-marquee-left:hover,
    .animate-marquee-right:hover,
    .animate-marquee-left-fast:hover {
      animation-play-state: paused;
    }

    /* 边缘遮罩 */
    .mask-gradient-full {
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
    }

    /* 卡片立柱工程网格图案 */
    .pillar-card-pattern {
      background-color: #deded9;
      background-image: 
        radial-gradient(rgba(11, 12, 11, 0.22) 0.8px, transparent 0.8px), 
        linear-gradient(to right, rgba(11, 12, 11, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(11, 12, 11, 0.04) 1px, transparent 1px);
      background-size: 16px 16px, 32px 32px, 32px 32px;
    }

    .pillar-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pillar-card:hover {
      transform: translateY(-8px);
      border-color: rgba(11, 12, 11, 0.55);
      box-shadow: 0 20px 35px -10px rgba(11, 12, 11, 0.12);
    }
  </style>
</head>

<body class="min-h-full bg-[#e3e3df] text-[#0b0c0b] selection:bg-[#0b0c0b] selection:text-[#e3e3df] antialiased overflow-x-hidden">
  <div id="root" class="min-h-full"></div>

  <!-- 按顺序引入拆分出的数据和组件 -->
  <script src="Projects/projectsData.js"></script>
  <script src="Projects/toolsData.js"></script>
  <script type="text/babel" src="Projects/ProjectsApp.js"></script>

  <!-- 执行挂载 -->
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<window.ProjectsPage />);
  </script>
</body>
</html>
